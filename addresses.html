<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alamat Saya | ARNOKIDS</title><link rel="stylesheet" href="css/userPages.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body>
<header class="page-head"><button class="back" onclick="goBackPage()"><i class="fa-solid fa-arrow-left"></i></button><h1>Alamat Saya</h1></header>
<main class="user-page"><section id="addressList"></section><button id="addAddressBtn" class="add-address">+ Tambah Alamat</button></main>
<div id="addressModal" class="logout-modal"><div class="logout-box" style="text-align:left;max-height:90vh;overflow:auto"><h2>Alamat</h2><form id="addressForm"><input type="hidden" name="index" value="-1"><div class="field" style="margin-bottom:10px"><label>Nama penerima</label><input name="name" required></div><div class="field" style="margin-bottom:10px"><label>WhatsApp</label><input name="wa" required></div><div class="field" style="margin-bottom:10px"><label>Alamat lengkap</label><textarea name="address" required></textarea></div><div class="field" style="margin-bottom:10px"><label>Kota</label><input name="city" required></div><div class="field" style="margin-bottom:10px"><label>Kecamatan</label><input name="district" required></div><div class="field" style="margin-bottom:10px"><label>Kode pos</label><input name="postal" required></div><label style="display:flex;align-items:center;gap:8px;margin:10px 0"><input type="checkbox" name="main" style="width:auto"> Jadikan alamat utama</label><div class="logout-actions"><button type="button" id="closeAddress" class="secondary">Batal</button><button type="submit" class="primary" style="margin:0">Simpan</button></div></form></div></div>
<div id="toast" class="toast"></div><nav class="bottom-nav"><a class="nav-item" href="index.html"><i class="fa-solid fa-house"></i><span>Beranda</span></a><a class="nav-item" href="index.html#search"><i class="fa-solid fa-magnifying-glass"></i><span>Cari</span></a><a class="nav-item" href="cart.html"><i class="fa-solid fa-cart-shopping"></i><span>Keranjang</span></a><a class="nav-item" href="wishlist.html"><i class="fa-regular fa-heart"></i><span>Wishlist</span></a><a class="nav-item active" href="profile.html"><i class="fa-solid fa-user"></i><span>Profil</span></a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/userPages.js"></script><script>function goBackPage(){if(history.length>1)history.back();else location.href="profile.html";}</script>
</body></html>

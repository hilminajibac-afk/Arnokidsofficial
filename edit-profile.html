<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Profil | ARNOKIDS</title><link rel="stylesheet" href="css/userPages.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body>

<main class="user-page"><form id="editProfileForm" class="card">

<button class="primary" type="submit">Simpan Perubahan</button></form></main>

<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Masuk ARNOKIDS</title>

<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/forgot-password.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/toast.css">
</head>

<body>

<div id="toast" class="toast"><i class="fa-solid fa-circle-check"></i><span id="toastText"></span></div>

<div class="auth-box">

<a href="index.html" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i>
</a>

<img src="images/logo.png" class="auth-logo">

<h2>Masuk</h2>

<p class="auth-subtitle">
Silakan masuk ke akun ARNOKIDS
</p>

<form id="loginForm">

<input
type="text"
id="whatsapp"
placeholder="Nomor WhatsApp"
required>

<div class="password-box">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <i class="fa-regular fa-eye toggle-password"></i>

</div>
<button type="submit">

Masuk

</button>

<a href="forgot-password.html" class="forgot-password">
    Lupa Password?
</a>

</form>

<p>

Belum punya akun?

<a href="register.html">

Daftar

</a>

</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/toast.js"></script>
<script src="js/login.js"></script>

<script src="js/auth.js"></script>
</body>
</html>
